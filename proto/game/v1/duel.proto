syntax = "proto3";

package game.v1;

option go_package = "github.com/dprishchepa/2d-pvp-duel/backend/internal/proto/game/v1;gamev1";

message AuthenticateRequest {
  string match_token = 1;
  string player_id = 2;
}

enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  ACTION_TYPE_DASH = 1;
  ACTION_TYPE_LIGHT_ATTACK = 2;
}

message ActionCommand {
  uint32 sequence = 1;
  ActionType type = 2;
}

message PlayerInput {
  uint32 tick = 1;
  sint32 move_x = 2;
  sint32 move_y = 3;
  bool attack = 4 [deprecated = true];
  repeated ActionCommand pending_actions = 5; // protocol maximum: 8
}

enum PlayerActionState {
  PLAYER_ACTION_STATE_IDLE = 0;
  PLAYER_ACTION_STATE_MOVE = 1;
  PLAYER_ACTION_STATE_DASH = 2;
  PLAYER_ACTION_STATE_LIGHT_ATTACK_WINDUP = 3;
  PLAYER_ACTION_STATE_LIGHT_ATTACK_ACTIVE = 4;
  PLAYER_ACTION_STATE_LIGHT_ATTACK_RECOVERY = 5;
  PLAYER_ACTION_STATE_HIT = 6;
  PLAYER_ACTION_STATE_KO = 7;
}

message PlayerState {
  string player_id = 1;
  sint32 position_x = 2;
  sint32 position_y = 3;
  int32 hp = 4;
  uint32 last_acked_input_tick = 5;
  sint32 facing_x = 6;
  sint32 facing_y = 7;
  uint32 last_acked_action_sequence = 8;
  PlayerActionState action_state = 9;
  uint32 action_started_server_tick = 10;
  uint32 action_ticks_remaining = 11;
}

// ACTIVE and FINISHED retain their original numeric values for wire compatibility.
enum MatchStatus {
  MATCH_STATUS_ACTIVE = 0;
  MATCH_STATUS_FINISHED = 1;
  MATCH_STATUS_WAITING = 2;
  MATCH_STATUS_COUNTDOWN = 3;
}

enum MatchFinishReason {
  MATCH_FINISH_REASON_UNSPECIFIED = 0;
  MATCH_FINISH_REASON_KO = 1;
  MATCH_FINISH_REASON_TIME_LIMIT = 2;
  MATCH_FINISH_REASON_DISCONNECT = 3;
}

message WorldSnapshot {
  uint32 server_tick = 1;
  repeated PlayerState players = 2;
  MatchStatus status = 3;
  string winner_player_id = 4;
  uint32 countdown_ticks_remaining = 5;
  uint32 match_ticks_remaining = 6;
}

message ClientEnvelope {
  oneof payload {
    AuthenticateRequest authenticate = 1;
    PlayerInput input = 2;
  }
}

message MatchReady {
  bool datagrams_enabled = 1;
  uint32 tick_rate = 2;
}

message ProtocolError {
  string code = 1;
  string message = 2;
}

// MatchStart and MatchEnd are sent on the reliable server stream. WorldSnapshot
// remains a lossy datagram update and is never the only source of a terminal result.
message MatchStart {
  WorldSnapshot initial_snapshot = 1;
  uint32 tick_rate = 2;
  uint32 countdown_ticks = 3;
  uint32 match_duration_ticks = 4;
}

message MatchEnd {
  WorldSnapshot final_snapshot = 1;
  string winner_player_id = 2;
  MatchFinishReason reason = 3;
}

message ServerEnvelope {
  oneof payload {
    WorldSnapshot snapshot = 1;
    ProtocolError error = 2;
    MatchReady ready = 3;
    MatchStart match_start = 4;
    MatchEnd match_end = 5;
  }
}
