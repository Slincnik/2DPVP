services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pvp_duel
      POSTGRES_USER: pvp_duel
      POSTGRES_PASSWORD: local_only_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../backend/migrations/000001_auth.up.sql:/docker-entrypoint-initdb.d/000001_auth.sql:ro
      - ../backend/migrations/000002_match_results.up.sql:/docker-entrypoint-initdb.d/000002_match_results.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvp_duel -d pvp_duel"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
