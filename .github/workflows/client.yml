name: Client

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            platform: linux
          - name: macos-arm64
            os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        env:
          GATEWAY_URL: https://example.invalid
          PVP_DUEL_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}
          PVP_DUEL_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          make appimage
          sha256sum dist/PvPDuel-x86_64.AppImage > dist/PvPDuel-x86_64.AppImage.sha256

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: brew install cmake buf protobuf abseil libmsquic openssl dylibbundler

      - name: Generate protobuf bindings
        if: matrix.platform == 'macos'
        run: make proto

      - name: Build macOS ARM64 client
        if: matrix.platform == 'macos'
        env:
          PVP_DUEL_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}
          PVP_DUEL_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          cmake -S client -B client/build-macos -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DPVP_DUEL_VERSION="$PVP_DUEL_VERSION" \
            -DPVP_DUEL_UPDATE_MANIFEST_URL="$PVP_DUEL_UPDATE_MANIFEST_URL"
          cmake --build client/build-macos --parallel
          ctest --test-dir client/build-macos --output-on-failure

          mkdir -p dist/PvPDuel.app/Contents/MacOS
          cp client/build-macos/pvp_duel_client dist/PvPDuel.app/Contents/MacOS/PvPDuel
          cp client/build-macos/pvp_duel_updater dist/PvPDuel.app/Contents/MacOS/pvp_duel_updater
          cat > dist/PvPDuel.app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>PvPDuel</string>
            <key>CFBundleIdentifier</key><string>com.github.dprishchepa.pvp-duel</string>
            <key>CFBundleName</key><string>PvP Duel</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${PVP_DUEL_VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${PVP_DUEL_VERSION#v}</string>
          </dict></plist>
          PLIST
          mkdir -p dist/PvPDuel.app/Contents/Frameworks
          protobuf_lib="$(find "$(brew --prefix protobuf)/lib" -maxdepth 1 -type f -name 'libprotobuf.*.dylib' -print -quit)"
          test -n "$protobuf_lib"
          protobuf_name="$(basename "$protobuf_lib")"
          cp -L "$protobuf_lib" "dist/PvPDuel.app/Contents/Frameworks/$protobuf_name"
          protobuf_reference="$(otool -L dist/PvPDuel.app/Contents/MacOS/PvPDuel | awk '/libprotobuf\./ {print $1; exit}')"
          test -n "$protobuf_reference"
          install_name_tool -change "$protobuf_reference" \
            "@executable_path/../Frameworks/$protobuf_name" \
            dist/PvPDuel.app/Contents/MacOS/PvPDuel
          app="dist/PvPDuel.app"
          frameworks="$app/Contents/Frameworks"
          main="$app/Contents/MacOS/PvPDuel"
          updater="$app/Contents/MacOS/pvp_duel_updater"

          dylibbundler -od -b \
            -x "$main" \
            -d "$frameworks" \
            -p '@executable_path/../Frameworks'
          dylibbundler -od -b \
            -x "$updater" \
            -d "$frameworks" \
            -p '@executable_path/../Frameworks'

          # Rewrite Homebrew references in the executables and all bundled dylibs.
          rewrite_homebrew_refs() {
            local binary="$1"
            local dependency name bundled

            while IFS= read -r dependency; do
              [[ "$dependency" == /opt/homebrew/* ]] || continue
              name="$(basename "$dependency")"
              bundled="$frameworks/$name"

              if [[ ! -f "$bundled" ]]; then
                echo "Missing bundled dependency: $dependency"
                return 1
              fi

              install_name_tool -change \
                "$dependency" \
                "@executable_path/../Frameworks/$name" \
                "$binary"
            done < <(
              otool -L "$binary" |
                awk 'NR > 1 {print $1}' |
                sort -u
            )
          }

          while IFS= read -r binary; do
            rewrite_homebrew_refs "$binary"
          done < <(
            find "$app/Contents" -type f \
              \( -name '*.dylib' -o -perm -111 \)
          )

          test -f "$frameworks/$protobuf_name"
          echo 'Main executable dependencies:'
          otool -L "$main"
          echo 'Updater dependencies:'
          otool -L "$updater"
          echo 'Bundled frameworks:'
          find "$frameworks" -maxdepth 1 -type f -print

          while IFS= read -r binary; do
            if grep -q '/opt/homebrew/' < <(otool -L "$binary"); then
              echo "Unbundled Homebrew dependency in: $binary"
              otool -L "$binary"
              exit 1
            fi
          done < <(
            find "$app/Contents" -type f \
              \( -name '*.dylib' -o -perm -111 \)
          )

          ditto -c -k --sequesterRsrc --keepParent \
            "$app" dist/PvPDuel-macos-arm64.zip
          shasum -a 256 dist/PvPDuel-macos-arm64.zip \
            > dist/PvPDuel-macos-arm64.zip.sha256

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pvp-duel-client-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pvp-duel-client-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          linux_sha256="$(cut -d' ' -f1 dist/PvPDuel-x86_64.AppImage.sha256)"
          macos_sha256="$(cut -d' ' -f1 dist/PvPDuel-macos-arm64.zip.sha256)"
          printf '{"version":"%s","platforms":{"linux-x86_64":{"url":"https://github.com/%s/releases/latest/download/PvPDuel-x86_64.AppImage","sha256":"%s"},"macos-arm64":{"url":"https://github.com/%s/releases/latest/download/PvPDuel-macos-arm64.zip","sha256":"%s"}}}\n' \
            "$version" "$GITHUB_REPOSITORY" "$linux_sha256" "$GITHUB_REPOSITORY" "$macos_sha256" \
            > dist/latest.json
          gh release create "$GITHUB_REF_NAME" \
            dist/PvPDuel-x86_64.AppImage \
            dist/PvPDuel-x86_64.AppImage.sha256 \
            dist/PvPDuel-macos-arm64.zip \
            dist/PvPDuel-macos-arm64.zip.sha256 \
            dist/latest.json \
            --title "PvP Duel $GITHUB_REF_NAME" \
            --generate-notes
